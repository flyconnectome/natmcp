# Publish the GitHub Pages site: the pkgdown docs plus the natmcp index.
# fetch_index() pulls index.rds + manifest.json from the site root,
# https://flyconnectome.github.io/natmcp/, alongside the pkgdown pages.
#
# Pages deploys replace the whole site, so docs and index ship together. The
# index is rebuilt on the weekly schedule / manual dispatch; pushes to main
# only rebuild the docs and carry over the currently published index.
#
# This is the CI half of the deployment split (PLAN.md, Option C): the index
# (data) is rebuilt on a schedule so signatures track the installed dev
# natverse, while the package (code) ships separately. Only the offline core is
# built here (no CAVE/neuprint tokens); online enrichment runs elsewhere.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      shapes:
        description: "Run examples for freshness + return shapes"
        type: boolean
        default: true
  schedule:
    - cron: "17 4 * * 1"   # weekly, Monday 04:17 UTC

name: build-index

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-index:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # System libraries the natverse core needs (rgl/OpenGL, XML, image IO).
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libglu1-mesa-dev libx11-dev libxml2-dev \
            libcurl4-openssl-dev libssl-dev libgit2-dev \
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev cmake

      # natmcp's own dependencies (from DESCRIPTION), then install natmcp.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # callr is a Suggests but required for the shapes pass (Phase 6);
          # "hard" deps otherwise keep the install lean.
          extra-packages: any::pak, any::callr, any::pkgdown
          dependencies: '"hard"'

      - name: Install natmcp
        run: R CMD INSTALL --no-multiarch --with-keep.source .

      # Install the packages the index introspects. Best-effort: build_index()
      # skips anything missing, so a single failing install does not abort.
      - name: Install natverse targets
        if: github.event_name != 'push'
        run: |
          Rscript -e '
            cfg <- yaml::read_yaml("inst/config/packages.yml")
            core <- unlist(cfg$tier_A_core, use.names = FALSE)
            adjacent <- names(cfg$adjacent)
            gh <- paste0("natverse/", core)
            for (p in c(gh, adjacent)) {
              tryCatch(
                pak::pkg_install(p, ask = FALSE, upgrade = FALSE),
                error = function(e) message("skip ", p, ": ", conditionMessage(e)))
            }
          '

      - name: Build index
        if: github.event_name != 'push'
        run: |
          Rscript -e '
            shapes <- tolower(Sys.getenv("NATMCP_SHAPES", "true")) == "true"
            natmcp::build_index(scope = "offline", shapes = shapes,
                                out_dir = "_index")
          '
        env:
          NATMCP_SHAPES: ${{ github.event.inputs.shapes || 'true' }}

      - name: Carry over the published index
        if: github.event_name == 'push'
        run: |
          mkdir -p _index
          for f in index.rds manifest.json; do
            curl -fsSL -o "_index/$f" "https://flyconnectome.github.io/natmcp/$f"
          done

      - name: Summarise manifest
        run: Rscript -e 'cat(readLines("_index/manifest.json"), sep = "\n")'

      # PLAN.md is an internal design doc; pkgdown would render any root .md.
      - name: Build pkgdown site
        run: |
          rm -f PLAN.md
          Rscript -e 'pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE, dest_dir = "_site")'

      - name: Add index to site
        run: cp _index/index.rds _index/manifest.json _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    needs: build-index
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
